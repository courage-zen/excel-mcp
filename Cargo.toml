[package]
name = "excel-mcp"
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
description = "Excel .xlsx create/read/edit as a Streamable HTTP MCP server with S3-only IO"

[dependencies]
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
object_store = { version = "0.14", features = ["aws"] }
rust_xlsxwriter = { version = "0.102" }
calamine = "0.38"
ironcalc = "0.9"
umya-spreadsheet = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"

futures = "0.3"
tempfile = "3"

[dev-dependencies]
testcontainers = "0.24"
testcontainers-modules = { version = "0.12", features = ["minio"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
tower = { version = "0.5", features = ["util"] }

[features]
integration = []

[[bin]]
name = "excel-mcp"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
